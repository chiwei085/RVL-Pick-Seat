# photo: assets/members/ 內的頭貼檔名，選填；未提供時會使用預設頭貼。
#
#   uv run pick-seat-gui -c configs/members.example.yaml \
#       --layout configs/seats_layout.example.yaml \
#       --photos-dir assets/members.example
